name: Validate manually entered coupon dates

on:
  workflow_dispatch:
    inputs:
      expected_date:
        description: "Manual check date already present in source (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-manual-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Read-only comparison (no files are changed)
        run: python scripts/record_coupon_check.py --expected-date "${{ inputs.expected_date }}"
